basePath: /
definitions:
  apperrors.Type:
    enum:
    - BAD_REQUEST
    - VALIDATION_ERROR
    - NOT_FOUND
    - CONFLICT
    - PAYLOAD_TOO_LARGE
    - UNSUPPORTED_MEDIA_TYPE
    - SERVICE_UNAVAILABLE
    - INTERNAL_ERROR
    type: string
    x-enum-varnames:
    - BadRequest
    - ValidationError
    - NotFound
    - Conflict
    - PayloadTooLarge
    - UnsupportedMediaType
    - ServiceUnavailable
    - InternalError
  dto.ErrorResponse:
    properties:
      error:
        example: Service unhealthy
        type: string
      timestamp:
        example: "2024-01-15T10:30:00Z"
        type: string
    type: object
  dto.HealthResponse:
    properties:
      database:
        type: string
      service:
        example: microservice-seed-go
        type: string
      timestamp:
        example: 2024-01-15T10.30:00Z
        type: string
    type: object
  handler.createOrderRequest:
    properties:
      customer_id:
        type: string
      items:
        items:
          $ref: '#/definitions/handler.orderItemRequest'
        type: array
    type: object
  handler.createOrderResponse:
    properties:
      id:
        type: string
      status:
        type: string
      total_minor:
        type: integer
    type: object
  handler.orderItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
      unit_price_minor:
        type: integer
    type: object
  httputil.ErrorBody:
    properties:
      code:
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        type: string
      type:
        $ref: '#/definitions/apperrors.Type'
    type: object
  httputil.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/httputil.ErrorBody'
      request_id:
        type: string
      timestamp:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API de EventFlow.
  title: EventFlow API
  version: "1.0"
paths:
  /healthz:
    get:
      description: Returns the health status of the service
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Health Check
      tags:
      - Health
  /orders:
    post:
      consumes:
      - application/json
      parameters:
      - description: Pedido
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.createOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Crear pedido
      tags:
      - orders
swagger: "2.0"
